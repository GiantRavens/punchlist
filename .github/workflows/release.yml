name: release

# Builds the release binaries. Runs when a v* tag is pushed by hand, and is
# called by auto-release.yml, whose own tag push cannot trigger workflows
# (GitHub does not start workflows from GITHUB_TOKEN pushes).
on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: "the tag to build and attach binaries to (v1.2.3)"
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            ext: ""
          - os: macos-latest
            goos: darwin
            goarch: amd64
            ext: ""
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: set up go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - name: build
        shell: bash
        run: |
          mkdir -p dist
          VERSION=$(cat VERSION)
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags "-X punchlist/cmd.Version=${VERSION}" -o dist/pin-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} .
      - name: release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
